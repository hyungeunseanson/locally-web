name: Authoritative Storage Byte Backup

on:
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-authoritative-storage-byte-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-backup
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STORAGE_SUPABASE_SERVICE_ROLE_KEY }}
      R2_SOURCE_ACCESS_KEY_ID: ${{ secrets.R2_SOURCE_READ_ACCESS_KEY_ID }}
      R2_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.R2_SOURCE_READ_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      GITHUB_TOKEN: ${{ github.token }}
      STORAGE_BACKUP_INCLUDE_MANAGED_ASSETS: 'true'
      AGE_VERSION: 1.3.1
      BOTO3_VERSION: 1.43.70

    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Require complete separated configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in SUPABASE_SERVICE_ROLE_KEY R2_SOURCE_ACCESS_KEY_ID R2_SOURCE_SECRET_ACCESS_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET AGE_RECIPIENT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production-backup configuration: $name" >&2
              exit 1
            fi
          done
          [[ "$R2_SOURCE_ACCESS_KEY_ID" != "$AWS_ACCESS_KEY_ID" ]]
          [[ "$R2_BUCKET" == locally-production-db-backups ]]
          [[ "$R2_ENDPOINT" == https://*.r2.cloudflarestorage.com ]]
          [[ "$AGE_RECIPIENT" == age1* ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]

      - name: Install pinned encryption and R2 client
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/storage-r2-venv"
          "${RUNNER_TEMP}/storage-r2-venv/bin/python" -m pip install --disable-pip-version-check --no-input "boto3==${BOTO3_VERSION}"
          echo "${RUNNER_TEMP}/storage-r2-venv/bin" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/storage-age.tar.gz"
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  ${RUNNER_TEMP}/storage-age.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/storage-age.tar.gz" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/age" >> "$GITHUB_PATH"

      - name: Capture both source providers and verify encrypted destination bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 scripts/backup/run_storage_backup.py --apply --summary "${RUNNER_TEMP}/storage-backup-summary.json"

      - name: Remove private plaintext and intermediate files
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for path in root.glob('locally-authoritative-storage-' + os.environ['GITHUB_RUN_ID'] + '-*'):
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
          PY

      - name: Publish sanitized result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'storage-backup-summary.json'
          if not path.exists():
              # Failure before operator start: no source or destination attempts.
              result = dict(status='failed', diagnosticCode='configuration_incomplete', stage='configuration', provider='none', operation='validate', elapsedSeconds=None, completedObjectCount=0, completedSourceBytes=0, sourceAttempts=0, sourceRetryCount=0, destinationCreateAttempts=0, destinationObjectsCreated=0, destinationBytesCreated=0, sourceWrites=0, sourceDeletes=0)
              path.write_text(json.dumps(result))
              path.chmod(0o600)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### Authoritative Storage byte backup\n')
              output.write('- Workflow result: ${{ job.status }}\n')
              if path.exists():
                  result = json.loads(path.read_text())
                  for field in ['status','diagnosticCode','stage','provider','operation','objectIdentityHash','elapsedSeconds','completedObjectCount','completedSourceBytes','sourceAttempts','sourceRetryCount','inventoryAttempts','inventoryRetryCount','destinationCreateAttempts','destinationObjectsCreated','destinationBytesCreated','sourceBudgetUsage','destinationBudgetUsage','snapshotId','providers','objectCount','sourceBytes','destinationByteVerification','databaseBackup','databaseBackupEvidence','captureBoundary','restoreProof']:
                      output.write('- ' + field + ': ' + json.dumps(result.get(field)) + '\n')
              output.write('- Source writes/deletes: 0\n- Private identity: offline only\n')
          PY

      - name: Preserve only sanitized capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authoritative-storage-backup-summary
          path: ${{ runner.temp }}/storage-backup-summary.json
          if-no-files-found: error
