name: Production Media Sync v2 Runner Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-24.04
    environment: production-media-sync-v2
    timeout-minutes: 5
    steps:
      - name: Show runner info
        run: |
          printf 'Runner: %s\nOS: %s\nArchitecture: %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - name: Show kernel info
        run: uname -a
