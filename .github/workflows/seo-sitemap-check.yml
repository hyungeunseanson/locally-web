name: SEO Sitemap Recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LOCALLY_ISR_BRIDGE_SOURCE: fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_cloudflare_foundation_fixture
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_cloudflare_foundation_fixture
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Robots search/training separation and native Next HTTP regressions
        run: node --test tests/unit/robots-policy.test.mjs
      - name: Local PostgreSQL (PGlite) and real SDK sitemap regressions
        run: npm run test:seo:sitemap
      - name: Community legacy/modern policy, privacy and Next HTTP regressions
        run: npm run test:seo:community
      - name: Public Host SSR and visibility regressions
        run: node --test tests/integration/public-host-ssr.test.mjs
      - name: Preserve Community UUID and Host approval/public visibility boundaries
        run: npx playwright test -c playwright.contracts.config.ts tests/e2e/community-invalid-uuid-guard.spec.mjs tests/e2e/199-host-visibility-util.spec.ts tests/e2e/278-host-application-approval-boundary.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Lint sitemap, Community and Host SSR changes
        run: npx eslint app/robots.ts tests/unit/robots-policy.test.mjs app/sitemap.ts app/utils/sitemapData.ts app/community/indexability.ts app/community/detailData.server.ts app/community/\[id\]/page.tsx app/users/\[id\]/page.tsx app/users/\[id\]/PublicUserProfileClient.tsx tests/integration/sitemap-recovery.test.mjs tests/integration/community-indexability.test.mjs tests/integration/public-host-ssr.test.mjs tests/e2e/community-invalid-uuid-guard.spec.mjs
      - name: Build OpenNext without provider access
        run: npm run cloudflare:build:production
      - name: Verify the real sitemap in local workerd with synthetic SQL and R2 only
        run: SITEMAP_RUNTIME=opennext npm run test:seo:sitemap
      - name: Verify Community metadata and sitemap consistency in local workerd
        run: COMMUNITY_SEO_RUNTIME=opennext npm run test:seo:community
      - run: git diff --check
