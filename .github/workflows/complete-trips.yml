name: Experience Completion Sync

on:
  schedule:
    # Every 2 hours, offset from the top of the hour to reduce scheduler congestion.
    - cron: '23 */2 * * *'

  workflow_dispatch:

concurrency:
  group: complete-trips
  cancel-in-progress: false

jobs:
  run-complete-trips:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger experience completion sync
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_URL:-}" ]; then
            echo "Missing GitHub secret: PROD_URL"
            echo "Add your production URL in GitHub -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            echo "Add the same CRON_SECRET value used in Vercel"
            exit 1
          fi

          case "$PROD_URL" in
            http://*|https://*)
              ;;
            *)
              echo "Invalid PROD_URL: must start with http:// or https://"
              echo "Current PROD_URL value is malformed or empty."
              exit 1
              ;;
          esac

          curl --silent --show-error --fail-with-body \
            -X GET "${PROD_URL%/}/api/cron/complete-trips" \
            -H "Authorization: Bearer ${CRON_SECRET}"
