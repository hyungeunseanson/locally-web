name: Admin Support Unread Alerts

on:
  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:

concurrency:
  group: admin-support-unread-alerts
  cancel-in-progress: false

jobs:
  run-admin-support-unread-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger admin support unread alerts
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_URL:-}" ]; then
            echo "Missing GitHub secret: PROD_URL"
            echo "Add your production URL in GitHub -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            echo "Add the same CRON_SECRET value used in Vercel"
            exit 1
          fi

          case "$PROD_URL" in
            http://*|https://*)
              ;;
            *)
              echo "Invalid PROD_URL: must start with http:// or https://"
              echo "Current PROD_URL value is malformed or empty."
              exit 1
              ;;
          esac

          curl --silent --show-error --fail-with-body \
            -X GET "${PROD_URL%/}/api/cron/admin-support-unread-alerts" \
            -H "Authorization: Bearer ${CRON_SECRET}"
