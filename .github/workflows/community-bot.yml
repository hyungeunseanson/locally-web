name: Locally Community Bot

on:
  # 커뮤니티 봇 미사용 중에는 자동 크론을 비활성화하고 수동 실행만 유지합니다.
  workflow_dispatch:
    inputs:
      job_type:
        description: '실행할 작업 (post 또는 comment)'
        required: true
        default: 'post'
        type: choice
        options:
          - post
          - comment

concurrency:
  group: community-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate scheduler secrets
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_URL:-}" ]; then
            echo "Missing GitHub secret: PROD_URL"
            echo "Add your production URL in GitHub -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            echo "Add the same CRON_SECRET value used in Vercel"
            exit 1
          fi

          case "$PROD_URL" in
            http://*|https://*)
              ;;
            *)
              echo "Invalid PROD_URL: must start with http:// or https://"
              echo "Current PROD_URL value is malformed or empty."
              exit 1
              ;;
          esac

          echo "BASE_URL=${PROD_URL%/}" >> "$GITHUB_ENV"

      - name: Auto Post Job
        if: github.event.inputs.job_type == 'post'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body \
            -X GET "${BASE_URL}/api/bot/auto-post" \
            -H "Authorization: Bearer ${CRON_SECRET}"

      - name: Auto Comment Job
        if: github.event.inputs.job_type == 'comment'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body \
            -X GET "${BASE_URL}/api/bot/auto-comment" \
            -H "Authorization: Bearer ${CRON_SECRET}"
