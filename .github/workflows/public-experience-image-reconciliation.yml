name: Public Experience Image Reconciliation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only completeness audit/plan, explicit create-only recovery apply, or legacy manifest reconciliation
        type: choice
        options: [audit, plan, apply, source-copy-plan, source-copy-apply, legacy-reconcile]
        default: audit
      approve_apply:
        description: Must be checked together with an exact fresh plan digest for apply
        type: boolean
        default: false
      confirm_digest:
        description: Exact fresh bounded recovery plan digest (apply only)
        type: string
        required: false
      cursor:
        description: Rotating source verification cursor
        type: string
        default: '0'
      max_source_downloads:
        description: Maximum bounded Supabase source GETs
        type: string
        default: '12'
      max_source_bytes:
        description: Maximum downloaded source bytes
        type: string
        default: '67108864'
      max_original_creates:
        description: Maximum immutable original creates
        type: string
        default: '12'
      max_derivative_creates:
        description: Maximum derivative creates
        type: string
        default: '40'
      max_transforms:
        description: Maximum Sharp transforms
        type: string
        default: '40'
  schedule:
    - cron: '48 5 * * *'

permissions:
  contents: read

concurrency:
  group: public-experience-image-reconciliation
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-media-sync
    outputs:
      drift: ${{ steps.audit.outputs.drift }}
      snapshot_hash: ${{ steps.audit.outputs.snapshot_hash }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Test incremental reconciliation boundaries
        run: node --test scripts/cloudflare/reconcile-public-experience-images.test.mjs

      - name: Audit Production image drift
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/reconcile-public-experience-images.mjs audit --output="${RUNNER_TEMP}/public-image-sync"

      - name: Finish without R2 credentials when no drift exists
        if: steps.audit.outputs.drift != 'true'
        shell: bash
        run: |
          {
            echo "### Public experience image reconciliation"
            echo "- Drift: none"
            echo "- R2 credentials: not loaded"
            echo "- R2 writes: skipped"
            echo "- Pull request: skipped"
          } >> "$GITHUB_STEP_SUMMARY"

  completeness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-media-sync
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: locally-public-experience-canary
      R2_PUBLIC_BASE_URL: https://media-canary.locally-travel.com
      BOTO3_VERSION: 1.43.70
      ACTION: ${{ github.event_name == 'schedule' && 'audit' || inputs.action }}
      CURSOR: ${{ inputs.cursor || '0' }}
      MAX_SOURCE_DOWNLOADS: ${{ inputs.max_source_downloads || '12' }}
      MAX_SOURCE_BYTES: ${{ inputs.max_source_bytes || '67108864' }}
      MAX_ORIGINAL_CREATES: ${{ inputs.max_original_creates || '12' }}
      MAX_DERIVATIVE_CREATES: ${{ inputs.max_derivative_creates || '40' }}
      MAX_TRANSFORMS: ${{ inputs.max_transforms || '40' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate fixed completeness boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == "https://uhinvcydgzqlpnvieyal.supabase.co" ]]
          [[ "$R2_ENDPOINT" == "https://d56f5f850c6f7dc5779a7c2054aca5a5.r2.cloudflarestorage.com" ]]
          [[ "$R2_BUCKET" == "locally-public-experience-canary" ]]
          [[ "$R2_PUBLIC_BASE_URL" == "https://media-canary.locally-travel.com" ]]
          if [[ "$ACTION" == "apply" ]]; then
            [[ "${{ inputs.approve_apply }}" == "true" ]]
            [[ "${{ inputs.confirm_digest }}" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Install pinned read-only R2 client
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/r2-venv"
          "${RUNNER_TEMP}/r2-venv/bin/python" -m pip install --disable-pip-version-check --no-input "boto3==${BOTO3_VERSION}"
          echo "${RUNNER_TEMP}/r2-venv/bin" >> "$GITHUB_PATH"

      - name: Run manifest-independent metadata completeness audit
        id: completeness_audit
        shell: bash
        run: |
          set -Eeuo pipefail
          audit_dir="${RUNNER_TEMP}/public-experience-completeness"
          mkdir -p "$audit_dir"
          node scripts/cloudflare/audit-public-experience-media.mjs metadata \
            --output="$audit_dir/audit" \
            --private-output="$audit_dir/.r2-inspection.json"

      - name: Install project dependencies for bounded plan or apply
        if: env.ACTION == 'plan' || env.ACTION == 'apply'
        run: npm ci

      - name: Build bounded source-proven recovery plan
        if: env.ACTION == 'plan' || env.ACTION == 'apply'
        id: recovery_plan
        shell: bash
        run: |
          set -Eeuo pipefail
          recovery_dir="${RUNNER_TEMP}/public-experience-completeness/recovery"
          node scripts/cloudflare/recover-public-experience-media.mjs plan \
            --r2-inspection="${RUNNER_TEMP}/public-experience-completeness/.r2-inspection.json" \
            --output="$recovery_dir" \
            --cursor="$CURSOR" \
            --maxSourceDownloads="$MAX_SOURCE_DOWNLOADS" \
            --maxSourceBytes="$MAX_SOURCE_BYTES" \
            --maxOriginalCreates="$MAX_ORIGINAL_CREATES" \
            --maxDerivativeCreates="$MAX_DERIVATIVE_CREATES" \
            --maxTransforms="$MAX_TRANSFORMS"

      - name: Verify source immediately before create-only apply
        if: env.ACTION == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          recovery_dir="${RUNNER_TEMP}/public-experience-completeness/recovery"
          [[ "${{ inputs.confirm_digest }}" == "${{ steps.recovery_plan.outputs.plan_digest }}" ]]
          node scripts/cloudflare/recover-public-experience-media.mjs verify-source \
            --plan="$recovery_dir/.recovery-plan.json" \
            --budget-state="$recovery_dir/.recovery-budget.json" \
            --confirm-digest="${{ inputs.confirm_digest }}" \
            --phase=preApply \
            --output="$recovery_dir"

      - name: Apply bounded create-only recovery
        if: env.ACTION == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          recovery_dir="${RUNNER_TEMP}/public-experience-completeness/recovery"
          python3 scripts/cloudflare/r2-public-image-recovery.py \
            --plan "$recovery_dir/.recovery-plan.json" \
            --budget-state "$recovery_dir/.recovery-budget.json" \
            --output "$recovery_dir/recovery-result.json" \
            --confirm-digest "${{ inputs.confirm_digest }}"

      - name: Verify source after create-only apply
        if: env.ACTION == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          recovery_dir="${RUNNER_TEMP}/public-experience-completeness/recovery"
          node scripts/cloudflare/recover-public-experience-media.mjs verify-source \
            --plan="$recovery_dir/.recovery-plan.json" \
            --budget-state="$recovery_dir/.recovery-budget.json" \
            --confirm-digest="${{ inputs.confirm_digest }}" \
            --phase=postApply \
            --output="$recovery_dir"

      - name: Upload sanitized completeness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-experience-media-completeness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-experience-completeness/audit/report.json
            ${{ runner.temp }}/public-experience-completeness/audit/summary.md
            ${{ runner.temp }}/public-experience-completeness/recovery/recovery-plan-summary.json
            ${{ runner.temp }}/public-experience-completeness/recovery/recovery-result.json
            ${{ runner.temp }}/public-experience-completeness/recovery/recovery-source-preApply.json
            ${{ runner.temp }}/public-experience-completeness/recovery/recovery-source-postApply.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded completeness summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Manifest-independent public media completeness"
            echo "- Action: ${ACTION}"
            echo "- Static manifest decision and R2 completeness decision: independent"
            echo "- Source GET budget: ${MAX_SOURCE_DOWNLOADS} objects / ${MAX_SOURCE_BYTES} bytes"
            echo "- Original/derivative create budget: ${MAX_ORIGINAL_CREATES}/${MAX_DERIVATIVE_CREATES}"
            echo "- Transform budget: ${MAX_TRANSFORMS}"
            echo "- Lifecycle source budget: plan + pre-apply + post-apply share one persisted ledger"
            echo "- Delete/CopyObject/Queue send: unsupported"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  source-authority-copy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.action == 'source-copy-plan' || inputs.action == 'source-copy-apply')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-media-sync
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: locally-public-experience-canary
      BOTO3_VERSION: 1.43.70
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate exact source-copy boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == "https://uhinvcydgzqlpnvieyal.supabase.co" ]]
          [[ "$R2_ENDPOINT" == "https://d56f5f850c6f7dc5779a7c2054aca5a5.r2.cloudflarestorage.com" ]]
          [[ "$R2_BUCKET" == "locally-public-experience-canary" ]]
          if [[ "${{ inputs.action }}" == "source-copy-apply" ]]; then
            [[ "${{ inputs.approve_apply }}" == "true" ]]
            [[ "${{ inputs.confirm_digest }}" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          python3 -m venv "${RUNNER_TEMP}/r2-source-copy-venv"
          "${RUNNER_TEMP}/r2-source-copy-venv/bin/python" -m pip install --disable-pip-version-check --no-input "boto3==${BOTO3_VERSION}"
          echo "${RUNNER_TEMP}/r2-source-copy-venv/bin" >> "$GITHUB_PATH"

      - name: Inspect R2 originals without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/experience-source-copy"
          chmod 700 "${RUNNER_TEMP}/experience-source-copy"
          python3 scripts/cloudflare/r2-experience-media-source-copy.py inspect \
            --output "${RUNNER_TEMP}/experience-source-copy/.r2-inspection.json"

      - name: Build fresh all-current-reference source-copy plan
        id: source_copy_plan
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/plan-experience-media-source-copy.mjs \
            --r2-inspection="${RUNNER_TEMP}/experience-source-copy/.r2-inspection.json" \
            --output="${RUNNER_TEMP}/experience-source-copy"

      - name: Apply exact create-only source-copy plan
        if: inputs.action == 'source-copy-apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ inputs.confirm_digest }}" == "${{ steps.source_copy_plan.outputs.plan_digest }}" ]]
          python3 scripts/cloudflare/r2-experience-media-source-copy.py apply \
            --plan "${RUNNER_TEMP}/experience-source-copy/.source-copy-plan.json" \
            --confirm-digest "${{ inputs.confirm_digest }}" \
            --output "${RUNNER_TEMP}/experience-source-copy/source-copy-result.json"

      - name: Upload sanitized source-copy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-media-source-copy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/experience-source-copy/source-copy-summary.json
            ${{ runner.temp }}/experience-source-copy/source-copy-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish source-copy summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Experience media authoritative source copy"
            echo "- Action: ${{ inputs.action }}"
            echo "- Plan digest: ${{ steps.source_copy_plan.outputs.plan_digest }}"
            echo "- Planned writes: ${{ steps.source_copy_plan.outputs.planned_writes }}"
            echo "- Scope: every currently DB-referenced experiences source"
            echo "- Write mode: conditional create-only"
            echo "- Copy/Delete/Queue operations: unsupported"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    needs: audit
    if: >-
      needs.audit.outputs.drift == 'true' &&
      (github.event_name == 'schedule' || inputs.action == 'legacy-reconcile')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-media-sync
    permissions:
      contents: write
      pull-requests: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: locally-public-experience-canary
      R2_PUBLIC_BASE_URL: https://media-canary.locally-travel.com
      NEXT_PUBLIC_CLOUDFLARE_IMAGE_CANARY_BASE_URL: https://media-canary.locally-travel.com
      BOTO3_VERSION: 1.43.70
      SYNC_BRANCH: automation/public-experience-image-reconciliation

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate fixed configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production-media-sync configuration: $name" >&2
              exit 1
            fi
          done
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == "https://uhinvcydgzqlpnvieyal.supabase.co" ]]
          [[ "$R2_ENDPOINT" == "https://d56f5f850c6f7dc5779a7c2054aca5a5.r2.cloudflarestorage.com" ]]
          [[ "$R2_BUCKET" == "locally-public-experience-canary" ]]
          [[ "$R2_PUBLIC_BASE_URL" == "https://media-canary.locally-travel.com" ]]

      - name: Install pinned R2 client
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/r2-venv"
          "${RUNNER_TEMP}/r2-venv/bin/python" -m pip install --disable-pip-version-check --no-input "boto3==${BOTO3_VERSION}"
          echo "${RUNNER_TEMP}/r2-venv/bin" >> "$GITHUB_PATH"

      - name: Verify R2 credentials before expensive work
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )
          client.list_objects_v2(Bucket=os.environ["R2_BUCKET"], MaxKeys=1)
          PY

      - name: Plan candidate manifests without downloading images
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/reconcile-public-experience-images.mjs plan --output="${RUNNER_TEMP}/public-image-sync"

      - name: Identify only missing R2 objects
        id: r2_plan
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/cloudflare/r2-public-image-reconcile.py \
            --mode plan \
            --plan "${RUNNER_TEMP}/public-image-sync/specifications.json" \
            --output "${RUNNER_TEMP}/public-image-sync/missing-objects.json"

      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts=false

      - name: Download and transform only missing R2 objects
        id: transform
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/reconcile-public-experience-images.mjs transform \
            --plan="${RUNNER_TEMP}/public-image-sync/specifications.json" \
            --missing="${RUNNER_TEMP}/public-image-sync/missing-objects.json" \
            --output="${RUNNER_TEMP}/public-image-sync"

      - name: Upload only missing R2 objects and verify integrity
        id: r2_sync
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/cloudflare/r2-public-image-reconcile.py \
            --mode upload \
            --plan "${RUNNER_TEMP}/public-image-sync/objects.json" \
            --expected "${RUNNER_TEMP}/public-image-sync/specifications.json" \
            --missing "${RUNNER_TEMP}/public-image-sync/missing-objects.json" \
            --output "${RUNNER_TEMP}/public-image-sync/r2-result.json"

      - name: Reject Production changes during reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cloudflare/reconcile-public-experience-images.mjs verify-snapshot \
            --plan="${RUNNER_TEMP}/public-image-sync/plan.json"

      - name: Apply verified candidate manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "${RUNNER_TEMP}/public-image-sync/publicExperienceCardImages.ts" app/data/publicExperienceCardImages.ts
          cp "${RUNNER_TEMP}/public-image-sync/publicExperienceDetailImages.generated.json" app/data/publicExperienceDetailImages.generated.json
          git diff --check

      - name: Install pinned Chromium for image boundary tests
        run: npx playwright install --with-deps chromium

      - name: Run Cloudflare image boundary tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          R2_ACCESS_KEY_ID: ''
          R2_SECRET_ACCESS_KEY: ''
          R2_ENDPOINT: ''
        run: >-
          npx playwright test -c playwright.cloudflare-images.config.ts
          tests/e2e/226-cloudflare-image-canary.spec.ts
          tests/e2e/227-cloudflare-public-card-images.spec.ts
          tests/e2e/228-cloudflare-public-detail-images.spec.ts
          --project=chromium --workers=1

      - name: Create or update one manifest pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- app/data/publicExperienceCardImages.ts app/data/publicExperienceDetailImages.generated.json; then
            echo "Verified drift produced no manifest change; refusing an empty PR." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git add app/data/publicExperienceCardImages.ts app/data/publicExperienceDetailImages.generated.json
          git commit -m "chore: reconcile public experience image manifests"
          git fetch origin "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"
          existing_pr="$(gh pr list --state open --head "$SYNC_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr comment "$existing_pr" --body "Updated from verified Production image reconciliation run ${GITHUB_RUN_ID}."
            echo "Updated existing PR #${existing_pr}."
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: reconcile public experience image manifests" \
              --body "Automated, verified manifest-only update. R2 objects were uploaded and checked before this PR was created. Production continues to use Supabase fallback until this PR is manually merged."
          fi

      - name: Publish non-sensitive summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Reconciliation safety"
            echo "- Direct push to main: disabled"
            echo "- Automatic Production deployment: disabled"
            echo "- Object deletion: disabled"
            echo "- Supabase credential: public anon only"
            echo "- R2 scope: fixed single bucket"
            echo "- Source images downloaded: ${{ steps.transform.outputs.source_download_count || '0' }}"
            echo "- Source bytes downloaded: ${{ steps.transform.outputs.source_download_bytes || '0' }}"
            echo "- Image variants generated: ${{ steps.transform.outputs.transformed_object_count || '0' }}"
            echo "- R2 objects uploaded: ${{ steps.r2_sync.outputs.uploaded_count || '0' }}"
            echo "- Expected R2 parity objects: ${{ steps.r2_plan.outputs.expected_count || '0' }}"
            echo "- R2 parity: ${{ steps.r2_sync.outputs.parity || 'not-run' }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
