name: Runner Acquisition Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-24-with-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-media-sync
    steps:
      - name: Print runner information
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"
          uname -a

  ubuntu-24-without-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print runner information
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"
          uname -a

  ubuntu-26-with-environment:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: production-media-sync
    steps:
      - name: Print runner information
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"
          uname -a

  ubuntu-26-without-environment:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Print runner information
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"
          uname -a
