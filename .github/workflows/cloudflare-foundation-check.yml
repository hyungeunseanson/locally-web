name: Cloudflare OpenNext Foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-opennext-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate backup restore lifecycle and isolation contracts
        run: npm run backup:restore:contract

      - name: Reproduce temporary readiness and validate a pinned-image cold restore
        run: npm run backup:restore:runtime

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      LOCALLY_ISR_BRIDGE_SOURCE: fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_cloudflare_foundation_fixture
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_cloudflare_foundation_fixture
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify pinned runtime dependencies
        run: npm ls @opennextjs/cloudflare@1.19.6 wrangler@4.129.1 next@16.3.5 eslint-config-next@16.3.5 react@19.2.3 react-dom@19.2.3 --depth=0

      - name: Lint
        run: npm run lint

      - name: Validate Supabase API-key transport and privileged binding compatibility
        run: npm run test:supabase-api-keys

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify admin guest review access and 390px review quality UI
        run: npx playwright test -c playwright.contracts.config.ts tests/e2e/269-admin-guest-review-quality.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Verify review request deep links and existing review boundaries
        run: npx playwright test -c playwright.contracts.config.ts tests/e2e/257-review-tour-end-app-cutover.spec.ts tests/e2e/258-guest-review-request-email.spec.ts tests/e2e/270-review-request-deep-links.spec.ts tests/e2e/271-review-request-reminders.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Verify review reminder migration timing, idempotency and role isolation
        run: node scripts/supabase/test-review-reminder-migration.mjs

      - name: Verify Customer Support phone workspace without external services
        run: npx playwright test -c playwright.phone-workspace.config.ts

      - name: Run Auth regression gate
        run: npm run test:e2e:auth-regression

      - name: Validate the patched Next.js runtime contract
        run: npm run test:e2e:next-security-contract

      - name: Validate the functional canary safety contract
        run: npm run cloudflare:functional:contract

      - name: Validate the migration manifest and bindings
        run: npm run cloudflare:migration:config

      - name: Validate migration runtime adaptations
        run: npm run cloudflare:migration:contract

      - name: Validate placement profile generation
        run: npm run cloudflare:placement:contract

      - name: Validate the immutable Supabase staging baseline
        run: npm run supabase:staging:baseline:check

      - name: Validate the Supabase Production current-state contract
        run: |
          npm run supabase:staging:current:check
          node scripts/supabase/production-current-state-contract.test.mjs

      - name: Validate private admin RLS helper migration
        run: npm run supabase:admin-reader-private:contract

      - name: Validate Supabase P0 Storage and RPC hardening
        run: npm run supabase:p0-security:contract

      - name: Validate experience payment claim and pending cleanup safety
        run: npm run supabase:experience-payment-claim:contract

      - name: Validate read-only public experience media audit boundaries
        run: npm run cloudflare:experience-media:audit:test

      - name: Validate controlled public experience media repair boundaries
        run: npm run cloudflare:experience-media:repair:test

      - name: Install isolated restore fixture encryption tool
        run: sudo apt-get update && sudo apt-get install --yes age

      - name: Validate avatar media authority and migration boundaries
        run: npm run storage:avatar:contract

      - name: Validate Host source authority, Auth atomic CAS, shared references and rollback
        run: npm run storage:host-profile:contract

      - name: Validate Host upload on local workerd and isolated R2 bindings
        run: npm run storage:host-profile:runtime

      - name: Validate canonical Admin Chat recency and serialized list refresh
        run: npm run test:admin-chat:recency

      - name: Install isolated native PostgreSQL 17 fixture
        run: npm install --prefix "$RUNNER_TEMP/host-pg17" --no-audit --no-fund embedded-postgres@17.6.0-beta.15 pg@8.16.3 esbuild@0.25.4

      - name: Validate canonical Admin Chat pagination, index and ACL on native PostgreSQL 17
        run: RECENCY_PG17_MODULES="$RUNNER_TEMP/host-pg17/node_modules" npm run test:admin-chat:recency:native

      - name: Validate Host source authority on native PostgreSQL 17
        run: HOST_PG17_MODULES="$RUNNER_TEMP/host-pg17/node_modules" npm run storage:host-profile:native

      - name: Validate Community immutable originals, operator and backup boundaries
        run: npm run storage:community:contract

      - name: Validate Community upload and full raster decode on local workerd and R2
        run: npm run storage:community:runtime

      - name: Validate Community image-set CAS on native PostgreSQL 17
        run: COMMUNITY_PG17_MODULES="$RUNNER_TEMP/host-pg17/node_modules" npm run storage:community:native

      - name: Reproduce Community freeze protection with upstream safeupdate on native PostgreSQL 17
        env:
          COMMUNITY_PG17_MODULES: ${{ runner.temp }}/host-pg17/node_modules
          COMMUNITY_SAFEUPDATE_LIBRARY: ${{ runner.temp }}/community-safeupdate.so
        run: |
          node scripts/supabase/build-community-safeupdate-fixture.mjs
          npm run storage:community:freeze-safeupdate:native

      - name: Validate Financial P0 on native PostgreSQL 17 and NICEPAY ACK
        run: |
          npm run test:solo-refund-ledger-proof
          SOLO_PG17_MODULES="$RUNNER_TEMP/host-pg17/node_modules" npm run test:solo-guarantee-p0:native
          node --test tests/unit/nicepay-solo-refund-notification.test.mjs

      - name: Validate Storage byte backup and lifecycle foundation
        run: npm run storage:foundation:contract

      - name: Validate experience media source authority migration boundaries
        run: npm run cloudflare:experience-media:source-migration-contract

      - name: Validate public host profile media boundaries
        run: npm run cloudflare:host-profile-media:test

      - name: Validate deterministic public experience media keys
        run: npm run cloudflare:experience-media:key-contract

      - name: Validate dormant public experience media Queue engine
        run: npm run cloudflare:experience-media:queue-engine:contract

      - name: Validate PostgreSQL-backed experience translation Queue transport
        run: npm run cloudflare:translation-queue:contract

      - name: Validate Home popularity Cloudflare Cron transport
        run: npm run cloudflare:home-popularity:contract

      - name: Validate Admin Support unread Cloudflare Cron transport
        run: npm run cloudflare:admin-support:contract

      - name: Validate read-only Ops Anomaly Monitor
        run: npm run cloudflare:ops-anomaly:contract

      - name: Validate notification retention Cloudflare Cron transport
        run: npm run cloudflare:notification-retention:contract

      - name: Validate Experience completion Cloudflare Cron transport
        run: npm run cloudflare:experience-completion:contract

      - name: Validate candidate release safety without provider mutations
        run: npm run cloudflare:candidate-release:contract

      - name: Validate ISR bridge without provider access
        run: npm run cloudflare:isr-bridge:contract

      - name: Validate the Production media build wrapper
        run: npm run cloudflare:production-build:contract

      - name: Remove contract dev-server output
        run: >-
          node -e "require('node:fs').rmSync('.next/dev', { recursive: true, force: true })"

      - name: Verify the existing Next.js build path
        run: npm run build

      - name: Build OpenNext worker
        run: npm run cloudflare:build:production

      - name: Verify locale-prefixed routes in the local OpenNext Worker
        run: node scripts/cloudflare/test-locale-routing-runtime.mjs

      - name: Generate canary and production binding types
        run: npm run cloudflare:typegen

      - name: Run canary and production Wrangler dry-runs
        run: npm run cloudflare:dry-run

      - name: Validate generated Worker cold scheduled and translation Queue runtime
        run: npm run cloudflare:translation-queue:runtime

      - name: Run placement profile Wrangler dry-runs
        run: npm run cloudflare:placement:dry-run

      - name: Enforce Worker bundle and static asset limits
        run: npm run cloudflare:artifacts:check

      - name: Verify patch integrity
        run: git diff --check
