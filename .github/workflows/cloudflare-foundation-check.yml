name: Cloudflare OpenNext Foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-opennext-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate backup restore lifecycle and isolation contracts
        run: npm run backup:restore:contract

      - name: Reproduce temporary readiness and validate a pinned-image cold restore
        run: npm run backup:restore:runtime

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-auth-regression-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-auth-regression-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify pinned runtime dependencies
        run: npm ls @opennextjs/cloudflare@1.19.6 wrangler@4.129.1 next@16.3.5 eslint-config-next@16.3.5 react@19.2.3 react-dom@19.2.3 --depth=0

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Auth regression gate
        run: npm run test:e2e:auth-regression

      - name: Validate the patched Next.js runtime contract
        run: npm run test:e2e:next-security-contract

      - name: Validate the functional canary safety contract
        run: npm run cloudflare:functional:contract

      - name: Validate the migration manifest and bindings
        run: npm run cloudflare:migration:config

      - name: Validate migration runtime adaptations
        run: npm run cloudflare:migration:contract

      - name: Validate placement profile generation
        run: npm run cloudflare:placement:contract

      - name: Validate the immutable Supabase staging baseline
        run: npm run supabase:staging:baseline:check

      - name: Validate the Supabase Production current-state contract
        run: npm run supabase:staging:current:check

      - name: Validate read-only public experience media audit boundaries
        run: npm run cloudflare:experience-media:audit:test

      - name: Validate controlled public experience media repair boundaries
        run: npm run cloudflare:experience-media:repair:test

      - name: Validate public host profile media boundaries
        run: npm run cloudflare:host-profile-media:test

      - name: Validate deterministic public experience media keys
        run: npm run cloudflare:experience-media:key-contract

      - name: Validate dormant public experience media Queue engine
        run: npm run cloudflare:experience-media:queue-engine:contract

      - name: Validate PostgreSQL-backed experience translation Queue transport
        run: npm run cloudflare:translation-queue:contract

      - name: Validate Home popularity Cloudflare Cron transport
        run: npm run cloudflare:home-popularity:contract

      - name: Validate Admin Support unread Cloudflare Cron transport
        run: npm run cloudflare:admin-support:contract

      - name: Validate notification retention Cloudflare Cron transport
        run: npm run cloudflare:notification-retention:contract

      - name: Validate the Production media build wrapper
        run: npm run cloudflare:production-build:contract

      - name: Verify the existing Next.js build path
        run: npm run build

      - name: Build OpenNext worker
        run: npm run cloudflare:build:production

      - name: Generate canary and production binding types
        run: npm run cloudflare:typegen

      - name: Run canary and production Wrangler dry-runs
        run: npm run cloudflare:dry-run

      - name: Validate generated Worker cold scheduled and translation Queue runtime
        run: npm run cloudflare:translation-queue:runtime

      - name: Run placement profile Wrangler dry-runs
        run: npm run cloudflare:placement:dry-run

      - name: Enforce Worker bundle and static asset limits
        run: npm run cloudflare:artifacts:check

      - name: Verify patch integrity
        run: git diff --check
