name: Experimental Release Browser Identity

on:
  pull_request:
    paths:
      - 'scripts/cloudflare/chromium8508456-profile.json'
      - 'scripts/cloudflare/verify-pinned-release-browser*'
      - 'docs/cloudflare/chromium8508456-verification.md'
      - '.github/workflows/release-browser-identity-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Reject wrong platform, bytes, API version and runtime identity
        run: node --test scripts/cloudflare/verify-pinned-release-browser.test.mjs
      - name: Lint diagnostic helpers
        run: npx eslint scripts/cloudflare/verify-pinned-release-browser.mjs scripts/cloudflare/verify-pinned-release-browser.test.mjs
      - run: git diff --check
