name: Chat performance regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Applied chat catalog bookkeeping must run the same regression gates.
      - 'supabase/staging/**'
      - 'scripts/supabase/*current-state*'
      - '.github/workflows/chat-performance-regression.yml'
      - 'app/hooks/useChat.ts'
      - 'app/api/inquiries/**'
      - 'app/guest/inbox/**'
      - 'app/host/dashboard/InquiryChat.tsx'
      - 'app/admin/dashboard/hooks/**'
      - 'app/admin/dashboard/components/**'
      - 'app/admin/layout.tsx'
      - 'app/utils/adminAttentionState.ts'
      - 'app/api/admin/sidebar-counts/**'
      - 'app/api/admin/customer-support/**'
      - 'app/api/admin/proxy-bookings/**'
      - 'app/api/proxy-bookings/**'
      - 'app/utils/phoneFollowup.ts'
      - 'tests/unit/phone-followup*'
      - 'tests/unit/phone-workspace.spec.ts'
      - 'supabase/migrations/*phone_followup*'
      - 'scripts/supabase/test-phone-followup-native.mjs'
      - 'playwright.phone-workspace.config.ts'
      - 'tests/unit/admin-attention*.test.mjs'
      - 'tests/unit/helpers/adminAttentionDatabase.mjs'
      - 'tests/fixtures/admin-attention*'
      - 'tests/ui/admin-attention-badges.spec.ts'
      - 'tests/ui/phone-workspace.spec.ts'
      - 'playwright.admin-attention.config.ts'
      - 'supabase/migrations/*admin_attention_badges*'
      - 'app/api/admin/inquiries/**'
      - 'app/utils/adminChatSearch.ts'
      - 'app/api/admin/chat-search/**'
      - 'tests/unit/admin-chat-search.test.mjs'
      - 'tests/ui/admin-chat-search.spec.ts'
      - 'playwright.admin-chat-search.config.ts'
      - 'supabase/migrations/*admin_chat_bounded_search*'
      - 'scripts/supabase/test-admin-chat-search-native.mjs'
      - 'app/utils/adminChatTime.ts'
      - 'app/utils/adminChatOperations.ts'
      - 'tests/unit/admin-chat-operations.test.mjs'
      - 'tests/ui/admin-chat-operations.spec.ts'
      - 'playwright.admin-chat-operations.config.ts'
      - 'app/utils/adminInquiryActivity.ts'
      - 'app/utils/adminSupportUnreadAlerts.ts'
      - 'supabase/migrations/*admin_message_monitoring*'
      - 'tests/unit/admin-message-monitoring*.test.mjs'
      - 'tests/ui/admin-message-monitoring.spec.ts'
      - 'playwright.admin-chat-phase1.config.ts'
      - 'app/utils/notificationLocale.ts'
      - 'app/utils/emailCopy.ts'
      - 'tests/unit/chat-performance-phase-1.test.mjs'
      - 'tests/unit/chat-performance-phase-2.test.mjs'
      - 'tests/unit/helpers/chatRuntime.mjs'
      - 'tests/unit/helpers/adminHistoricalReinquiryFixture.mjs'
      - 'tests/unit/fixtures/admin-chat-before-review.ts.txt'
      - 'scripts/supabase/test-admin-chat-native-races.mjs'
      - 'tests/unit/admin-support-direct-messaging.test.ts'
      - 'tests/e2e/*chat*'
      - 'tests/e2e/*inquiry*'
      - 'playwright.chat-regression.config.ts'
      - 'playwright.chat-platform-regression.config.ts'
      - 'package*.json'
      - '.github/workflows/chat-performance-regression.yml'

permissions:
  contents: read

concurrency:
  group: chat-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      # Use peer resolution compatible with the existing lockfile.
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      # All I/O is mocked. This job has no application server or service secrets.
      - run: npx tsc --noEmit
      - run: npm run test:admin-chat:search
      - run: npm run test:admin-chat:recency
      - run: npm run test:admin-chat:operations
      - run: npm run test:admin-chat:phase1
      - run: npm run test:admin-attention:phase2
      - run: npm run cloudflare:production-build:contract

  phone-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:phone-followup
        env:
          PHONE_WEBKIT: '1'
      # Local PG17 process, three independent connections, no remote credentials.
      - run: npm install --prefix "$RUNNER_TEMP/phone-pg17" --no-audit --no-fund embedded-postgres@17.10.0-beta.17 pg@8.23.1
      - run: npm run test:phone-followup:native
        env:
          PHONE_NATIVE_MODULES: ${{ runner.temp }}/phone-pg17/node_modules

      - run: npm run test:admin-chat:search:native
        env:
          PHONE_NATIVE_MODULES: ${{ runner.temp }}/phone-pg17/node_modules
