name: Chat performance regressions

on:
  pull_request:
    paths:
      - 'app/hooks/useChat.ts'
      - 'app/api/inquiries/**'
      - 'app/guest/inbox/**'
      - 'app/host/dashboard/InquiryChat.tsx'
      - 'app/admin/dashboard/hooks/useAdminChatQuery.ts'
      - 'app/utils/notificationLocale.ts'
      - 'app/utils/emailCopy.ts'
      - 'tests/unit/chat-performance-phase-1.test.mjs'
      - 'tests/unit/helpers/chatRuntime.mjs'
      - 'tests/unit/admin-support-direct-messaging.test.ts'
      - 'tests/e2e/*chat*'
      - 'tests/e2e/*inquiry*'
      - 'playwright.chat-regression.config.ts'
      - 'package*.json'
      - '.github/workflows/chat-performance-regression.yml'

permissions:
  contents: read

concurrency:
  group: chat-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      # Use peer resolution compatible with the existing lockfile.
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # All I/O is mocked. This job has no application server or service secrets.
      - run: npm run test:chat:phase1
